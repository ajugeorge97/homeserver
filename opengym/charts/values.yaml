podSecurityContext:
  fsGroup: 1001

securityContext:
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  # The chart shares this context across containers. nginx owns its writable paths as UID 1001.
  runAsUser: 1001
  runAsGroup: 1001

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: "opengym.ajugeorge.com"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: opengym-tls
      hosts:
        - "opengym.ajugeorge.com"

api:
  image:
    tag: 1.4.3
  env:
    RP_ID: "opengym.ajugeorge.com"
    ORIGIN: "https://opengym.ajugeorge.com"

persistence:
  data:
    existingClaim: opengym-data-pvc

web:
  image:
    tag: 1.4.3
