ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: "opengym.ajugeorge.com"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: opengym-tls
      hosts:
        - "opengym.ajugeorge.com"

api:
  env:
    RP_ID: "opengym.ajugeorge.com"
    ORIGIN: https://"opengym.ajugeorge.com"

persistence:
  data:
    storageClass: local-path
    size: 2Gi