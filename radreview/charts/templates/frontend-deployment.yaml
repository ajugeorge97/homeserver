apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-frontend" .Release.Name | quote }}
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: {{ .Release.Name | quote }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: {{ .Release.Name | quote }}
    spec:
      serviceAccountName: {{ .Release.Name | quote }}
      containers:
        - name: frontend
          image: {{ .Values.frontend.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: OHIF_ROOT
              valueFrom:
                configMapKeyRef:
                  name: {{ printf "%s-config" .Release.Name | quote }}
                  key: OHIF_ROOT
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      {{- with .Values.frontend.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: {{ .Release.Name | quote }}
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
