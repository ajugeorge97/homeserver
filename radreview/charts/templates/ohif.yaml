apiVersion: apps/v1
kind: Deployment
metadata:
  name: ohif
  namespace: {{ .Values.global.namespace}}
  labels:
    app.kubernetes.io/name: ohif
    app.kubernetes.io/part-of: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ohif
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ohif
        app.kubernetes.io/part-of: {{ .Release.Name }}
    spec:
      containers:
        - name: ohif
          image: {{ .Values.ohif.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      {{- with .Values.frontend.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: ohif
  namespace: {{ .Values.global.namespace}}
  labels:
    app.kubernetes.io/name: ohif
    app.kubernetes.io/part-of: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: ohif
  ports:
    - name: http
      port: 80
      targetPort: http