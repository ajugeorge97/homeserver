apiVersion: v1
kind: Service
metadata:
  name: orthanc
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    app.kubernetes.io/name: orthanc
    app.kubernetes.io/part-of: {{ .Release.Name | quote }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: orthanc
  ports:
    - name: http
      port: 8042
      targetPort: http
    - name: dicom
      port: 4242
      targetPort: dicom
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orthanc
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    app.kubernetes.io/name: orthanc
    app.kubernetes.io/part-of: {{ .Release.Name | quote }}
spec:
  serviceName: orthanc
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orthanc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orthanc
        app.kubernetes.io/part-of: {{ .Release.Name | quote }}
    spec:
      serviceAccountName: {{ .Release.Name | quote }}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.orthanc.persistence.existingClaim | quote }}
      containers:
        - name: orthanc
          image: orthancteam/orthanc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8042
            - name: dicom
              containerPort: 4242
          env:
            - name: ORTHANC__NAME
              value: RadReviewOrthanc
            - name: ORTHANC__REMOTE_ACCESS_ALLOWED
              value: "true"
            - name: ORTHANC__AUTHENTICATION_ENABLED
              value: "true"
            - name: ORTHANC__REGISTERED_USERS
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-secrets" .Release.Name | quote }}
                  key: ORTHANC_REGISTERED_USERS
            - name: ORTHANC__DICOM_WEB__ENABLE
              value: "true"
            - name: ORTHANC__DICOM_WEB__ROOT
              value: /dicom-web/
            - name: ORTHANC__DICOM_WEB__ENABLE_WADO
              value: "true"
            - name: ORTHANC__DICOM_WEB__WADO_ROOT
              value: /wado
            - name: ORTHANC__DICOM_WEB__SSL
              value: "false"
            - name: ORTHANC__DICOM_WEB__STUDIES_METADATA
              value: Full
            - name: ORTHANC__DICOM_WEB__SERIES_METADATA
              value: Full
          volumeMounts:
            - name: data
              mountPath: /var/lib/orthanc/db
              {{- with .Values.orthanc.persistence.subPath }}
              subPath: {{ . | quote }}
              {{- end }}
          
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
      {{- with .Values.orthanc.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
