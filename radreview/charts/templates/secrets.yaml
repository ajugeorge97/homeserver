apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name}}-secrets
  namespace: {{ .Values.global.namespace}}
type: Opaque
stringData:
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: change-me-now
  ORTHANC_USERNAME: radreview
  ORTHANC_PASSWORD: replace-with-a-strong-orthanc-password
  ORTHANC_REGISTERED_USERS: '{"radreview":"replace-with-a-strong-orthanc-password"}'