# Stop RadReview workloads and hibernate PostgreSQL while retaining storage.
suspended: false

global:
  namespace: radreview
persistance:
  create: true
  storageClass: local-path
  volumeName: radreview-pv
  resources:
    requests:
      storage: 1Gi

frontend:
  replicas: 1
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts: radreview.ajugeorge.com
  image: ajugeorge97/radreview-frontend:0.2.21
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

backend:
  replicas: 1
  image: ajugeorge97/radreview-backend:0.2.21
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  

ohif:
  replicas: 1
  image: ajugeorge97/radreview-ohif:0.2.10
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  
postgress:
  create: true
  instances: 1
  storage:
    size: 20Gi

orthanc:
  replicas: 1
  persistence:
    existingClaim: project-settings
    subPath: "orthanc_data"
  securityContext:
    runAsUser: 999
    runAsGroup: 999
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
