global:
  namespace: radreview
persistance:
  create: true
  storageClass: local-path
  volumeName: radreview-pv
  resources:
    requests:
      storage: 1Gi

frontend:
  replicas: 1
  image: ajugeorge97/radreview-frontend:0.2.21
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

backend:
  image: ajugeorge97/radreview-backend:0.2.21
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  

ohif:
  image: ajugeorge97/radreview-ohif:0.2.10
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  
postgress:
  create: true
  instances: 1
  storage:
    size: 20Gi

orthanc:
  persistence:
    existingClaim: project-settings
    subPath: "orthanc_data"
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
